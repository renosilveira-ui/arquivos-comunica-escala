name: Dependency Audit

on:
  push:
    branches: [main]
  schedule:
    # Daily coverage keeps new advisories and expired exceptions from waiting
    # for the next repository change. 09:23 UTC = 06:23 America/Sao_Paulo.
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Validate lockfile and patches
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies
        run: pnpm security:audit
