name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs for the same PR/branch when a new commit lands.
# Main branch runs are never cancelled — they must complete to provide the
# "ran on default branch" status that branch protection requires.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: escalas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/escalas_test
      # A prova da migration manual cria e remove um schema efêmero com
      # prefixo allowlisted no MySQL de serviço da própria CI. Nunca usa a
      # DATABASE_URL da aplicação nem um host externo.
      SECTOR_SERVICE_SPECIALTIES_MIGRATION_TEST_SERVER_URL: mysql://root:root@127.0.0.1:3306/mysql
      # A prova da provisão Unimed também recebe somente o servidor local da
      # CI e cria um schema efêmero prefixado. O comando de produto é
      # read-only e a flag --apply é bloqueada.
      UNIMED_HOSPITAL_PROVISION_TEST_SERVER_URL: mysql://root:root@127.0.0.1:3306/mysql
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        # Version is read from package.json's "packageManager" field
        # (pnpm@9.12.0). Specifying it here as well is rejected by the
        # action to prevent version drift.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm security:audit

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo "MySQL is up"
              exit 0
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
          echo "::error::MySQL did not become ready within 60s"
          exit 1

      - name: Apply database schema
        # `pnpm db:push` runs `drizzle-kit generate && drizzle-kit migrate`,
        # which depends on a journal/meta directory that this repo does not
        # commit. For CI we sync the schema directly from drizzle/schema.ts
        # via `drizzle-kit push --force` (non-interactive, idempotent).
        run: pnpm exec drizzle-kit push --force

      - name: Validate sector specialties manual migration
        run: pnpm test:sector-service-specialties-migration

      - name: Validate readiness fence V1 over Drizzle PREPARED schema
        # Exercita o único estado retomável: o schema foi criado pelo Drizzle,
        # mas os triggers e o recibo ainda não existem. Continua restrito ao
        # MySQL efêmero da CI, nunca ao DATABASE_URL de outro ambiente.
        env:
          READINESS_FENCE_V1_APPLY: "1"
          READINESS_FENCE_V1_DATABASE_URL: mysql://root:root@127.0.0.1:3306/escalas_test
          READINESS_FENCE_V1_ALLOW_INSECURE_LOOPBACK_FOR_TEST: "1"
        run: pnpm apply:readiness-fence-v1

      - name: Prove readiness fence V1 manual migration
        # Somente esta etapa pode autorizar a criação/remoção do schema
        # efêmero; os demais testes não recebem esse opt-in.
        env:
          READINESS_FENCE_V1_PROOF_ALLOW_DESTRUCTIVE: "1"
          READINESS_FENCE_V1_PROOF_SERVER_URL: mysql://root:root@127.0.0.1:3306/
        run: pnpm exec tsx scripts/prove-readiness-fence-v1-migration.ts

      - name: Validate readiness fence V1 event journal concurrency
        # Reaproveita a URL já declarada para a prova manual. O teste cria seu
        # próprio schema efêmero e não recebe a DATABASE_URL da aplicação.
        env:
          READINESS_FENCE_V1_MYSQL_TEST_SERVER_URL: ${{ env.READINESS_FENCE_V1_PROOF_SERVER_URL }}
        run: pnpm test:readiness-fence-v1-mysql

      - name: Validate Unimed hospital provision plan
        run: pnpm test:unimed-hospital-provision

      - name: Lint
        run: pnpm lint

      - name: Typecheck server
        run: pnpm typecheck:server

      - name: Typecheck app
        run: pnpm typecheck:app

      - name: Build server
        run: pnpm build

      - name: Build web
        run: pnpm build:web

      - name: Test operational events migration contract
        # O teste cria bancos aleatórios apenas no service MySQL local da CI.
        env:
          OPERATIONAL_EVENTS_MIGRATION_MYSQL_TEST: "1"
          OPERATIONAL_EVENTS_MIGRATION_MYSQL_URL: mysql://root:root@127.0.0.1:3306
        run: pnpm exec vitest run --config vitest.operational-events-mysql.config.ts

      - name: Test
        run: pnpm test

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
