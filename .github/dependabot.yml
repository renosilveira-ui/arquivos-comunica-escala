version: 2

# Dependabot configuration. Two ecosystems are tracked:
#   - npm: production and dev dependencies of this project
#   - github-actions: pinned action versions in .github/workflows/*
#
# Security advisories are filed daily by GitHub regardless of this schedule;
# the weekly cadence below covers non-security version bumps so the noise is
# bounded. Group rules collapse minor/patch updates so we get one PR per
# group per week instead of dozens of individual bumps.

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    groups:
      security-patches:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"
      runtime-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    # Pacotes cuja versão é DITADA pelo Expo SDK (npx expo install).
    # Bumps isolados desalinham o par SDK↔pacote e quebram o build EAS
    # na fase de bundle/codegen — foi exatamente o que aconteceu em
    # 2026-08 (react-native 0.85 com SDK 54 → codegen error; build
    # a3927275 falhou; PRs #112/#114 fechadas pelo mesmo motivo).
    # Estes pacotes só sobem junto com o upgrade deliberado de SDK.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-svg"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react-native-web"
      - dependency-name: "@types/react"
      - dependency-name: "@react-native/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    # Ignore major-version bumps for CI-critical actions. The Dependabot
    # compatibility score for actions/checkout v4 → v6 was 40% across the
    # ecosystem (PR #30); v4 remains supported. We still receive minor and
    # patch updates automatically — only majors require an explicit,
    # deliberate frente.
    ignore:
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
