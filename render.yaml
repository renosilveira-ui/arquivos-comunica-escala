# render.yaml — Blueprint for the Escala API on Render.
# https://render.com/docs/blueprint-spec
#
# Apply via the Render dashboard: Blueprints → New Blueprint Instance →
# point at this repository. After creation, manually fill the env vars
# marked `sync: false` in the dashboard (Render does not pre-populate
# secrets from yaml).
#
# IMPORTANT — single-instance constraint
# server/integrations/comunica-plus.ts holds session/cache state in
# process memory (see docs/operations/scaling.md). Do NOT raise
# numInstances above 1 until that state is moved to a shared store.

services:
  - type: web
    name: escalas-staging
    runtime: node
    # free = a instância DORME após 15 min sem tráfego e leva 30–60 s para
    # acordar (o app abre do cache nesse meio-tempo, mas dados novos só
    # chegam depois). Para o piloto não depender disso: `starter`
    # (US$ 7/mês, sem spin-down). Decisão de custo do PO — ver
    # docs/operations/cold-start.md.
    #
    # O dispatcher de confirmação (setInterval 60s neste processo) some
    # com o spin-down. 24/7 = EXTERNAL_INFRA_ACTION_REQUIRED (Starter ou
    # Cron cobrado). Não criar type: cron aqui sem aprovação de custo —
    # ver docs/operations/confirmation-coverage.md.
    plan: free
    # Virginia desde 12/09/2026: o banco (DigitalOcean) fica em Nova York e a
    # latência servidor→banco caiu de 78 ms para 8 ms. Endereço público:
    # app.comunicamais-escala.com.br (CNAME para o subdomínio onrender do
    # serviço). Mudar região no Render = criar serviço novo; o antigo em
    # Oregon (escalas-staging.onrender.com) fica ligado até a build do app
    # apontar para o domínio novo.
    region: virginia
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm build:all
    # Node direto, sem passar pelo pnpm: numa instância free (0,1 CPU) o
    # `pnpm start` levava ~20 s só para chegar ao `node` (logs do Render,
    # 23/08 — "Running 'pnpm start'" 03:39:59 → script 03:40:19). O bundle
    # é .mjs para o Node não reparsear o arquivo como ESM. NODE_ENV vem do
    # envVars abaixo. Se o serviço NÃO for gerido por este Blueprint,
    # espelhar no dashboard (Settings → Start Command).
    startCommand: node dist/index.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # ---- Runtime ----
      - key: NODE_ENV
        value: production

      # ---- Database (DigitalOcean Managed MySQL) ----
      # DATABASE_SSL=insecure: TLS on, cert validation off. Acceptable
      # for staging because the DO cluster ships with a self-signed CA;
      # tighten to `require` once we mount the DO CA bundle or migrate
      # to a publicly-signed cert.
      - key: DATABASE_SSL
        value: insecure
      # Full mysql:// URI with password — set in dashboard, never in yaml.
      - key: DATABASE_URL
        sync: false

      # ---- Session signing ----
      # Render generates a strong random value once and persists it across
      # deploys. No human ever sees or types this secret.
      - key: COOKIE_SECRET
        generateValue: true
      # Exclusivo dos códigos de convite; preencher antes do runtime HMAC.
      # Nunca reutilizar COOKIE_SECRET, JWT, Twilio ou RESEND_API_KEY.
      - key: SCHEDULE_INVITE_CODE_PEPPER
        sync: false
      # Opcional: manter o pepper anterior por pelo menos 24 h na rotação;
      # outboxes vigentes referenciam seu key-id opaco e falham fechado sem ele.
      - key: SCHEDULE_INVITE_CODE_PREVIOUS_PEPPER
        sync: false
      # Same-origin: frontend is now served by the Express server itself
      # (web-build/ static files). Cookies are first-party, so `lax` is
      # both safe and sufficient. No cross-site cookie needed.
      - key: COOKIE_SAMESITE
        value: lax
      # STOP: manter 0 até 100% das réplicas suportarem exact-v1. Em fase 1,
      # mudar só o server para 1; clientes antigos seguem legacy.
      - key: SESSION_EXACT_BINDING_SUPPORTED
        value: "0"

      # ---- CORS ----
      # Same-origin mode: frontend served by Express, so CORS is only
      # needed for mobile app or external consumers. Leave empty for
      # maximum restriction; add mobile deep-link origins if needed.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # ---- Frontend (baked at build time) ----
      # Empty = same-origin mode. The web app uses relative URLs to hit
      # the API on the same Express server. Mobile continues to use the
      # full URL via EXPO_PUBLIC_API_URL in their own env.
      - key: EXPO_PUBLIC_API_URL
        value: ""
      # Fase 2, baked no bundle: só mudar após o preflight supported=true em
      # todas as réplicas e gerar um novo build aprovado separadamente.
      - key: EXPO_PUBLIC_SESSION_EXACT_BINDING_CLIENT_ACTIVE
        value: "0"

      # ---- Comunica+ integration ----
      # Fail-closed na Beta. Não mudar para 1 até o contrato remoto aceitar
      # idempotência por dedupKey e o gate operacional estar concluído.
      - key: COMUNICA_PLUS_OUTBOUND_ENABLED
        value: "0"
      - key: COMUNICA_PLUS_URL
        value: https://comunicamais-staging.onrender.com
      - key: COMUNICA_PLUS_SYSTEM_EMAIL
        sync: false
      - key: COMUNICA_PLUS_SYSTEM_PASSWORD
        sync: false
      - key: COMUNICA_PLUS_SYSTEM_PIN
        sync: false
      - key: COMUNICA_JWKS_URI
        value: https://comunicamais-staging.onrender.com/.well-known/jwks.json
      - key: COMUNICA_ISSUER
        value: https://comunicamais-staging.onrender.com
      - key: COMUNICA_AUDIENCE
        value: escalas-app
      # Tenant code → internal id map. Semi-secret because it leaks the
      # internal id space; kept out of yaml.
      - key: COMUNICA_TENANT_MAP
        sync: false

      # ---- SSO Escala → Comunica+ (RS256 + JWKS) ----
      # Sem estes, uma instância nova do Blueprint sobe com o SSO apontando
      # para localhost e sem chave (o botão "Abrir Comunica+" falha).
      - key: SSO_TARGET_URL
        value: https://comunicamais-staging.onrender.com
      - key: SSO_ISSUER
        value: escalas-app
      - key: SSO_AUDIENCE
        value: comunicamais
      - key: SSO_KID
        value: escala-sso-staging-2026
      # {"<institutionId>":"<uuid da organização no Comunica+>"}
      - key: SSO_ORG_MAP
        sync: false
      # Chave privada RSA (JWK JSON). Em dev é gerada em .sso-keystore.json.
      - key: SSO_PRIVATE_KEY_JWK
        sync: false

      # ---- E-mail transacional / recuperação de credenciais ----
      # Sem RESEND_API_KEY o outbox termina fail-closed; a API informa apenas
      # que o pedido foi recebido, nunca que houve entrega.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: "Escala+ <suportec@comunicamais-escala.com.br>"
      - key: APP_PUBLIC_URL
        value: https://app.comunicamais-escala.com.br
      # Chave AES-GCM dedicada. Rotação: mover a atual para PREVIOUS, criar
      # nova CURRENT/KID e só remover PREVIOUS após a retenção do runbook.
      - key: AUTH_RECOVERY_ENCRYPTION_CURRENT_KID
        sync: false
      - key: AUTH_RECOVERY_ENCRYPTION_CURRENT_SECRET
        sync: false
      - key: AUTH_RECOVERY_ENCRYPTION_PREVIOUS_KID
        sync: false
      - key: AUTH_RECOVERY_ENCRYPTION_PREVIOUS_SECRET
        sync: false

      # ---- HospitalAlert integration (optional) ----
      - key: HOSPITAL_ALERT_URL
        value: https://hospital-alert.example.com
      - key: HOSPITAL_ALERT_API_KEY
        sync: false
      - key: HOSPITAL_ALERT_ORG_ID
        value: hsc

      # ---- Integrações externas (PRs 3-6) ----
      # Todas OPCIONAIS e desligadas por ausência de credencial: sem elas o
      # serviço sobe normal, a Agenda pessoal funciona e a escala não muda.
      # Preencher pela METADE é o que derruba o boot — se for configurar um
      # provedor, configure todas as variáveis dele na mesma janela.
      #
      # Nada aqui é ativado por este Blueprint. Cada valor é preenchido no
      # dashboard quando a PR correspondente for aprovada.
      #
      # Chave AES-GCM das credenciais externas. Dedicada: o boot recusa
      # reuso de COOKIE_SECRET ou das chaves de AUTH_RECOVERY. Rotação:
      # mover a atual para PREVIOUS, gerar nova CURRENT/KID, e só remover
      # PREVIOUS após a varredura de rotação concluir.
      - key: EXTERNAL_CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: EXTERNAL_CREDENTIALS_ENCRYPTION_KID
        sync: false
      - key: EXTERNAL_CREDENTIALS_ENCRYPTION_PREVIOUS_KEY
        sync: false
      - key: EXTERNAL_CREDENTIALS_ENCRYPTION_PREVIOUS_KID
        sync: false
      # Google OAuth (Agenda). Em produção o redirect precisa ser https, sem
      # localhost e sem fragmento, e estar allowlisted no Google Cloud.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      # Google Maps Platform (Places + Routes). Chave server-side, restrita
      # por API e por IP no Google Cloud. Nunca vai para o bundle Expo.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      # Apple WeatherKit. Chave privada ES256 assinada no servidor.
      - key: WEATHERKIT_TEAM_ID
        sync: false
      - key: WEATHERKIT_SERVICE_ID
        sync: false
      - key: WEATHERKIT_KEY_ID
        sync: false
      - key: WEATHERKIT_PRIVATE_KEY
        sync: false

      # ---- Feature flags ----
      - key: SHIFT_RADAR_ENABLED
        value: "false"

  # ---------------------------------------------------------------------------
  # Frontend (Expo Web) — DEPRECATED
  # ---------------------------------------------------------------------------
  # The web frontend is now served by the Express API server itself (same
  # origin). The separate static site (escalas-staging-web) should be
  # suspended/deleted in the Render dashboard once the unified service is
  # verified working. Keeping this comment for historical reference.
